[tool.poetry]
name = "bank-widget"
version = "0.1.0"
description = "Виджет банковских операций клиента"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{include = "src"}]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"

[tool.poetry.group.lint.dependencies]
flake8 = "^7.1.1"
black = "^24.10.0"
isort = "^5.13.2"
mypy = "^1.13.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"

[tool.black]
line-length = 119
target-version = ["py312"]
exclude = '''
/(/|venv|\.venv|\.git|__pycache__|_build|dist|\.tox)/
'''

[tool.isort]
profile = "black"
line_length = 119

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"